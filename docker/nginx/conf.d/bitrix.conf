server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size (for file uploads)
    client_max_body_size 256M;

    # Log files
    access_log /var/log/nginx/bitrix_access.log;
    error_log /var/log/nginx/bitrix_error.log;

    # Static files - cache them
    location ~* \.(jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 3d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block access to hidden files (like .htaccess, .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to bitrix/cache and bitrix/backup directories
    location ~ ^/bitrix/(cache|backup|logs)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to .access.php and other sensitive files
    location ~* \.(access|config|inc|sh|sql|sql\.gz|tar\.gz|tgz|zip|bz2)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=256M\npost_max_size=256M\nmax_execution_time=600\nmax_input_vars=5000";
    }

    # Bitrix clean URL rewrite rules
    location / {
        try_files $uri $uri/ /bitrix/routing_index.php$is_args$args;
    }
}
