server {
    listen 443 ssl;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 256M;

    access_log /var/log/nginx/bitrix_ssl_access.log;
    error_log /var/log/nginx/bitrix_ssl_error.log;

    # Static files
    location ~* \.(jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 3d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block bitrix/cache and bitrix/backup
    location ~ ^/bitrix/(cache|backup|logs)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive file extensions
    location ~* \.(access|config|inc|sh|sql|sql\.gz|tar\.gz|tgz|zip|bz2)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bitrix clean URL rewrite
    location / {
        try_files $uri $uri/ /bitrix/routing_index.php$is_args$args;
    }
}
